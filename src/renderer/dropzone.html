<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DropZone</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: transparent;
      overflow: hidden;
      width: 100%;
      height: 100%;
      -webkit-user-select: none;
      user-select: none;
      cursor: move;
      -webkit-app-region: drag;
    }
    #dropzone-root {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div id="dropzone-root"></div>
  <script type="module" src="/src/dropzone.tsx"></script>
</body>
</html>
